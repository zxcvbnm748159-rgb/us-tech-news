name: Update news

on:
  schedule:
    - cron: "*/15 * * * *"    # ตรวจข่าวและแจ้งเตือนทุก 15 นาที (เวลา UTC)
    - cron: "0 */3 * * *"     # สร้างสรุปตลาดทุก 3 ชั่วโมง (เวลา UTC)
  workflow_dispatch:           # กดรันเองได้จากหน้า Actions

permissions:
  contents: write

concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_news.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GENERATE_DAILY_SUMMARY: ${{ github.event.schedule != '*/15 * * * *' }}
      - name: Commit changes
        run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/news.json data/market_summary.json data/market_sentiment.json data/trending_topics.json
          git diff --staged --quiet || git commit -m "update news"
          git push
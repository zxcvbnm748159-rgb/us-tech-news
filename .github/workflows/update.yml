name: Update news

on:
  push:
    branches:
      - main
    paths:
      - "scripts/fetch_news.py"
      - "requirements.txt"
      - ".github/workflows/update.yml"
  schedule:
    - cron: "*/15 * * * *"    # ตรวจข่าวและแจ้งเตือนทุก 15 นาที (เวลา UTC)
    - cron: "0 */3 * * *"     # สร้างสรุปตลาดทุก 3 ชั่วโมง (เวลา UTC)
  workflow_dispatch:           # กดรันเองได้จากหน้า Actions

permissions:
  contents: write

concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python scripts/fetch_news.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GENERATE_DAILY_SUMMARY: ${{ github.event.schedule != '*/15 * * * *' }}
      - name: Validate generated data and application tests
        run: python -m pytest -q
      - name: Commit changes
        run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/news.json data/market_summary.json data/market_sentiment.json data/trending_topics.json data/stock_analysis.json
          git diff --staged --quiet || git commit -m "update news"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying after backoff..."
            sleep $((attempt * 5))
          done
          echo "Unable to publish data after 5 attempts"
          exit 1
      - name: Notify Telegram on failure
        if: failure()
        uses: ./.github/actions/notify-telegram
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          workflow-name: ${{ github.workflow }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
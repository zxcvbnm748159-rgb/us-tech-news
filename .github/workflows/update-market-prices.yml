name: Update market prices

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_market_data.py
      - name: Commit changes
        run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/market_prices.json
          git diff --staged --quiet || git commit -m "update market prices"
          git push

name: Notify Telegram
description: Send a workflow failure notification when Telegram credentials are configured
inputs:
  bot-token:
    description: Telegram bot token
    required: false
  chat-id:
    description: Telegram chat ID
    required: false
  workflow-name:
    description: Name of the failed workflow
    required: true
  run-url:
    description: URL of the failed workflow run
    required: true
runs:
  using: composite
  steps:
    - name: Send failure notification
      shell: bash
      env:
        TELEGRAM_BOT_TOKEN: ${{ inputs.bot-token }}
        TELEGRAM_CHAT_ID: ${{ inputs.chat-id }}
        WORKFLOW_NAME: ${{ inputs.workflow-name }}
        RUN_URL: ${{ inputs.run-url }}
      run: |
        if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
          echo "Telegram notification skipped: configure TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID secrets to enable it."
          exit 0
        fi

        python - <<'PY'
        import json
        import os
        from urllib.request import Request, urlopen

        token = os.environ["TELEGRAM_BOT_TOKEN"]
        payload = json.dumps({
            "chat_id": os.environ["TELEGRAM_CHAT_ID"],
            "text": (
                f"GitHub Actions workflow failed: {os.environ['WORKFLOW_NAME']}\n"
                f"{os.environ['RUN_URL']}"
            ),
        }).encode()
        request = Request(
            f"https://api.telegram.org/bot{token}/sendMessage",
            data=payload,
            headers={"Content-Type": "application/json"},
        )
        with urlopen(request, timeout=15) as response:
            result = json.loads(response.read())
        if not result.get("ok"):
            raise RuntimeError("Telegram rejected the failure notification")
        print("Telegram failure notification sent")
        PY
